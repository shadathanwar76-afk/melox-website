<!DOCTYPE html>
<html>
<head>
    <title>MELOX Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #error {
            color: red;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>MELOX</h1>
    <p>Admin Login</p>

    <input
        type="password"
        id="password"
        placeholder="Enter admin password"
    >

    <button onclick="login()">Login</button>

    <div id="error">Incorrect password</div>

</div>

<script>

function login() {

    const password = document.getElementById("password").value;

    // CHANGE THIS PASSWORD
    const adminPassword = "MELOX@2026";

    if (password === adminPassword) {

        window.location.href = "admin-files.html";

    } else {

        document.getElementById("error").style.display = "block";

    }
}

</script>

</body>
</html>
