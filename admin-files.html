<!DOCTYPE html>
<html>
<head>
    <title>MELOX Admin Files</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .file {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .open {
            background: #111;
            color: white;
            padding: 9px 15px;
            border-radius: 7px;
            text-decoration: none;
        }

        @media(max-width:600px) {
            .file {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MELOX</h1>
    <p>Admin Panel</p>
</header>

<div class="container">
    <div class="card">
        <h2>📁 Uploaded Files</h2>
        <div id="files">Loading files...</div>
    </div>
</div>

<script>
const backend = "https://melox-website.onrender.com";

fetch(backend + "/files")
.then(res => res.json())
.then(data => {

    const box = document.getElementById("files");

    const files = (data.files || [])
        .filter(file => file !== ".gitkeep");

    if (files.length === 0) {
        box.innerHTML = "<p>No files uploaded yet.</p>";
        return;
    }

    box.innerHTML = "";

    files.forEach(file => {
        box.innerHTML += `
            <div class="file">
                <span>📄 ${file}</span>
                <a class="open"
                   href="${backend}/files/${encodeURIComponent(file)}"
                   target="_blank">
                   Open
                </a>
            </div>
        `;
    });

})
.catch(() => {
    document.getElementById("files").innerHTML =
        "<p>Could not connect to server.</p>";
});
</script>

</body>
</html>
